<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Reviews</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Movie Reviews</span>
        <a class="btn btn-outline-light btn-sm" href="/about/">About</a>
      </div>
    </nav>

    <div class="container py-4">
      <h1>Welcome to Home Page, {{ name }}</h1>
      <p class="text-muted">This is the full home page.</p>

      <form method="GET" class="row g-2 my-3">
        <div class="col-auto flex-grow-1">
          <input
            type="text"
            name="searchMovie"
            class="form-control"
            placeholder="Search movie..."
            value="{{ searchTerm }}"
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <h2 class="mb-3">Movies</h2>
      <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div class="col">
          <div class="card h-100 shadow-sm">
            <img
              src="{{ movie.image.url }}"
              class="card-img-top"
              alt="{{ movie.title }}"
              style="height: 340px; object-fit: cover"
            />
            <div class="card-body">
              <h5 class="card-title">{{ movie.title }}</h5>
              <p class="card-text">{{ movie.description }}</p>
              {% if movie.url %}
              <a href="{{ movie.url }}" class="btn btn-sm btn-outline-secondary"
                >More info</a
              >
              {% endif %}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
