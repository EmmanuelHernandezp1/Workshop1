<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Reviews</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body style="background-color: #0b0b0b">
    <nav class="navbar bg-black border-bottom border-secondary">
      <div class="container">
        <span class="navbar-brand mb-0 h1 text-light">Movie Reviews</span>
        <a class="btn btn-outline-light btn-sm" href="/about/">About</a>
      </div>
    </nav>

    <div class="container py-4">
      <h1 class="text-light">Welcome to Home Page, {{ name }}</h1>
      <p class="text-secondary">This is the full home page.</p>

      <form method="GET" class="row g-2 my-4">
        <div class="col">
          <input
            type="text"
            name="searchMovie"
            class="form-control"
            placeholder="Search movie..."
            value="{{ searchTerm|default_if_none:'' }}"
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <h2 class="text-light mb-3">Movies</h2>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        {% for movie in movies %}
        <div class="col">
          <div
            class="card h-100 border-secondary"
            style="background-color: #161616"
          >
            <div
              style="
                height: 380px;
                background-color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
              "
            >
              <img
                src="{{ movie.image.url }}"
                alt="{{ movie.title }}"
                style="max-height: 100%; max-width: 100%; object-fit: contain"
              />
            </div>
            <div class="card-body">
              <h5 class="card-title text-light">{{ movie.title }}</h5>
              <p class="card-text text-secondary">{{ movie.description }}</p>
              {% if movie.url %}
              <a href="{{ movie.url }}" class="btn btn-sm btn-outline-light"
                >More info</a
              >
              {% endif %}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
